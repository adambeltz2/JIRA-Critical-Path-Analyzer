                                            <div className="legend-item">
                                                <svg width="20" height="2"><line x1="0" y1="1" x2="20" y2="1" stroke="#4527A0" strokeWidth="2" /></svg>
                                                <span>Parent ↔ Subtask</span>
                                            </div>
                                            <div className="legend-item">
                                                <svg width="16" height="16"><circle cx="8" cy="8" r="6" fill="none" stroke="#C62828" strokeWidth="2" /></svg>
                                                <span>Blocked (has an open blocker)</span>
                                            </div>
                                            <div className="legend-item">
                                                <svg width="20" height="2"><line x1="0" y1="1" x2="20" y2="1" stroke="#00897B" strokeWidth="3" /></svg>
                                                <span>Cross-project link</span>
                                            </div>
                                        </div>
                                        <div className="graph-toolbar">
                                            <input
                                                type="text"
                                                className="key-filter-input"
                                                placeholder="Filter by key(s), e.g. TMD-10, TMD-15"
                                                value={keyFilterInput}
                                                onChange={(e) => setKeyFilterInput(e.target.value)}
                                                onKeyDown={(e) => { if (e.key === 'Enter') applyKeyFilterInput(); }}
                                            />
                                            <button onClick={applyKeyFilterInput} title="Show these issues and everything they link to">Focus</button>
                                            <button
                                                className={`tab-button ${showBlockedOnly ? 'active' : ''}`}
                                                style={{ padding: '6px 12px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '4px' }}
                                                onClick={() => setShowBlockedOnly(v => !v)}
                                                title="Show only issues involved in a blocking relationship"
                                            >
                                                🚧 {showBlockedOnly ? 'Showing blocked issues only' : 'Show blocked issues only'}
                                            </button>
                                            <button
                                                className={`tab-button ${showCrossProjectOnly ? 'active' : ''}`}
                                                style={{ padding: '6px 12px', fontSize: '13px', border: '1px solid #ddd', borderRadius: '4px' }}
                                                onClick={() => setShowCrossProjectOnly(v => !v)}
                                                title="Show only issues linked to an issue in a different project"
                                            >
                                                🔗 {showCrossProjectOnly ? 'Showing cross-project issues only' : 'Show cross-project issues only'}
                                            </button>
                                            {lineageFocusKeys.length > 0 ? (
                                                <span className="lineage-focus-badge">
                                                    🔍 Focused on {lineageFocusKeys.join(', ')} ({getUnionLineageKeys(lineageFocusKeys).size} issues incl. links)
                                                    <button onClick={clearLineageFocus} title="Show full graph">✕ Clear</button>
                                                </span>
                                            ) : (
                                                <span className="lineage-hint">Type one or more keys above, or click a node, to isolate its dependency lineage (blockers/blocked-by/subtasks/relates)</span>
                                            )}
                                        </div>
                                        <div className="graph-wrapper">
                                            <div className="zoom-controls">
                                                <button className="zoom-btn" onClick={handleZoomIn} title="Zoom in">+</button>
                                                <button className="zoom-btn" onClick={handleZoomOut} title="Zoom out">−</button>
                                                <button className="zoom-btn reset" onClick={handleZoomReset} title="Reset zoom">⤢</button>
                                            </div>
                                            <div className="graph-container" ref={graphRef}></div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'table' && (
                                    <div>
                                        {typeStatusLegend}
                                        <div className="controls">
                                            <input
                                                type="text"
                                                className="filter-input"
                                                placeholder="Filter by key, summary, or assignee..."
                                                value={filterText}
                                                onChange={(e) => setFilterText(e.target.value)}
                                            />
                                            <button onClick={exportCSV}>📥 Export CSV</button>
                                        </div>

                                        <div className="table-container">
                                            <table>
                                                <thead>
                                                    <tr>
                                                        <th onClick={() => handleSort('key')}>
                                                            Key {sortColumn === 'key' && (sortDesc ? '▼' : '▲')}
                                                        </th>
                                                        <th onClick={() => handleSort('summary')}>
                                                            Summary {sortColumn === 'summary' && (sortDesc ? '▼' : '▲')}
                                                        </th>
                                                        <th>Type</th>
                                                        <th onClick={() => handleSort('status')}>
                                                            Status {sortColumn === 'status' && (sortDesc ? '▼' : '▲')}
                                                        </th>
                                                        <th onClick={() => handleSort('priority')}>
                                                            Priority {sortColumn === 'priority' && (sortDesc ? '▼' : '▲')}
                                                        </th>
                                                        <th onClick={() => handleSort('assignee')}>
                                                            Assignee {sortColumn === 'assignee' && (sortDesc ? '▼' : '▲')}
                                                        </th>
                                                        <th>Subtasks</th>
                                                        <th>Parent</th>
                                                        {tableLinkLabels.map(label => (
                                                            <th key={label}>{formatLinkLabel(label)}</th>
                                                        ))}
                                                        <th>Critical Path</th>
                                                        <th>Cross-Project</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {sortedIssues.map(issue => (
                                                        <tr
                                                            key={issue.key}
                                                            className={[
                                                                isOnCriticalPath(issue.key) ? 'critical-path-highlight' : '',
                                                                isCrossProject(issue.key) ? 'cross-project-highlight' : ''
                                                            ].filter(Boolean).join(' ')}
                                                        >
                                                            <td className="issue-key" onClick={() => setSelectedIssue(issue.key)} style={{ cursor: 'pointer' }}>
                                                                {issue.key}
                                                            </td>
                                                            <td>{issue.fields.summary.substring(0, 60)}</td>
                                                            <td>
                                                                <span className="type-badge" style={{ background: getTypeColor(getIssueType(issue)), color: 'white' }}>
                                                                    {getIssueType(issue)}
                                                                </span>
                                                            </td>
                                                            <td>
                                                                <span className={`status-badge ${getStatusBadgeClass(getIssueStatus(issue))}`}>
                                                                    {getIssueStatus(issue)}
                                                                </span>
                                                            </td>
                                                            <td className={getPriorityClass(getIssuePriority(issue))}>
                                                                {getIssuePriority(issue)}
                                                            </td>
                                                            <td>{issue.fields.assignee?.displayName || 'Unassigned'}</td>
                                                            <td>
                                                                {(() => {
                                                                    const subtasks = getSubtaskKeys(issue);
                                                                    return subtasks.length > 0 ? subtasks.map((k, i) => (
                                                                        <React.Fragment key={k}>
                                                                            {i > 0 && ', '}
                                                                            <a onClick={() => setSelectedIssue(k)} style={{ cursor: 'pointer' }}>{k}</a>
                                                                        </React.Fragment>
                                                                    )) : '—';
                                                                })()}
                                                            </td>
                                                            <td>
                                                                {(() => {
                                                                    const parentKey = getParentKey(issue);
                                                                    return parentKey ? (
                                                                        <a onClick={() => setSelectedIssue(parentKey)} style={{ cursor: 'pointer' }}>
                                                                            {parentKey}
                                                                        </a>
                                                                    ) : '—';
                                                                })()}
                                                            </td>
                                                            {tableLinkLabels.map(label => (
                                                                <td key={label}>
                                                                    {(() => {
                                                                        const keys = getLinkedKeysByLabel(issue, label);
                                                                        return keys.length > 0 ? keys.map((k, i) => (
                                                                            <React.Fragment key={k}>
                                                                                {i > 0 && ', '}
                                                                                <a onClick={() => setSelectedIssue(k)} style={{ cursor: 'pointer' }}>{k}</a>
                                                                            </React.Fragment>
                                                                        )) : '—';
                                                                    })()}
                                                                </td>
                                                            ))}
                                                            <td>{isOnCriticalPath(issue.key) ? '⭐ Yes' : '—'}</td>
                                                            <td>{isCrossProject(issue.key) ? '🔗 Yes' : '—'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'crossproject' && (
                                    <div>
                                        <p style={{ fontSize: '13px', color: '#666', marginBottom: '15px' }}>
                                            Every dependency link whose two issues belong to different projects (by JIRA key prefix) — {crossProjectDependencies.length} link(s) across {crossProjectIssueKeys.size} issue(s).
                                        </p>
                                        {crossProjectDependencies.length === 0 ? (
                                            <div className="status-message">No cross-project links found in this result set.</div>
                                        ) : (
                                            <div className="table-container">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>From</th>
                                                            <th>From Project</th>
                                                            <th>Relationship</th>
                                                            <th>To</th>
                                                            <th>To Project</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {[...crossProjectDependencies]
                                                            .sort((a, b) => a.from.localeCompare(b.from))
                                                            .map((dep, idx) => (
                                                                <tr key={`${dep.from}-${dep.to}-${dep.label}-${idx}`}>
                                                                    <td className="issue-key" onClick={() => setSelectedIssue(dep.from)} style={{ cursor: 'pointer' }}>
                                                                        {dep.from}
                                                                    </td>
                                                                    <td>{getProjectKey(dep.from)}</td>
                                                                    <td>{formatLinkLabel(dep.label)}</td>
                                                                    <td className="issue-key" onClick={() => setSelectedIssue(dep.to)} style={{ cursor: 'pointer' }}>
                                                                        {dep.to}
                                                                    </td>
                                                                    <td>{getProjectKey(dep.to)}</td>
                                                                </tr>
                                                            ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {selectedIssueData && (
                        <div className="detail-panel">
                            <div className="detail-header">
                                <div>
                                    <h3>{selectedIssue}</h3>
                                    <p style={{ fontSize: '12px', color: '#666', marginTop: '4px' }}>{selectedIssueData.fields.summary}</p>
                                </div>
                                <button className="detail-close" onClick={() => setSelectedIssue(null)}>✕</button>
                            </div>

                            <div className="detail-content">
                                <div className="detail-field">
                                    <div className="detail-label">Type</div>
                                    <div className="detail-value">
                                        <span className="type-badge" style={{ background: getTypeColor(getIssueType(selectedIssueData)), color: 'white' }}>
                                            {getIssueType(selectedIssueData)}
                                        </span>
                                    </div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Status</div>
                                    <div className="detail-value">
                                        <span className={`status-badge ${getStatusBadgeClass(getIssueStatus(selectedIssueData))}`}>
                                            {getIssueStatus(selectedIssueData)}
                                        </span>
                                    </div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Priority</div>
                                    <div className={`detail-value ${getPriorityClass(getIssuePriority(selectedIssueData))}`}>
                                        {getIssuePriority(selectedIssueData)}
                                    </div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Assignee</div>
                                    <div className="detail-value">{selectedIssueData.fields.assignee?.displayName || 'Unassigned'}</div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">On Critical Path</div>
                                    <div className="detail-value">{isOnCriticalPath(selectedIssue) ? '⭐ Yes' : 'No'}</div>
                                </div>

                                {getSubtaskKeys(selectedIssueData).length > 0 && (
                                    <div className="detail-field">
                                        <div className="detail-label">Subtasks</div>
                                        <ul className="blocker-list">
                                            {getSubtaskKeys(selectedIssueData).map(subKey => (
                                                <li key={subKey}>
                                                    <a onClick={() => setSelectedIssue(subKey)} style={{ cursor: 'pointer' }}>
                                                        {subKey}
                                                    </a>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                {getParentKey(selectedIssueData) && (
                                    <div className="detail-field">
                                        <div className="detail-label">Parent</div>
                                        <div className="detail-value">
                                            <a onClick={() => setSelectedIssue(getParentKey(selectedIssueData))} style={{ cursor: 'pointer' }}>
                                                {getParentKey(selectedIssueData)}
                                            </a>
                                        </div>
                                    </div>
                                )}

                                {getAllLinkLabels().map(label => {
                                    const keys = getLinkedKeysByLabel(selectedIssueData, label);
                                    if (keys.length === 0) return null;
                                    return (
                                        <div className="detail-field" key={label}>
                                            <div className="detail-label">{formatLinkLabel(label)}</div>
                                            <ul className="blocker-list">
                                                {keys.map(relatedKey => (
                                                    <li key={relatedKey}>
                                                        <a onClick={() => setSelectedIssue(relatedKey)} style={{ cursor: 'pointer' }}>
                                                            {relatedKey}
                                                        </a>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    );
                                })}

                                <div className="detail-field">
                                    <div className="detail-label">Sprint</div>
                                    <div className="detail-value">
                                        {(() => {
                                            const sprint = getCurrentSprint(selectedIssueData);
                                            if (!sprint) return 'No sprint';
                                            return (
                                                <>
                                                    {sprint.name}
                                                    {sprint.state && (
                                                        <span style={{ color: '#888', fontSize: '12px', marginLeft: '6px' }}>
                                                            ({sprint.state})
                                                        </span>
                                                    )}
                                                </>
                                            );
                                        })()}
                                    </div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Due Date</div>
                                    <div className="detail-value">{getDueDate(selectedIssueData) || 'No due date'}</div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Created</div>
                                    <div className="detail-value">{new Date(selectedIssueData.fields.created).toLocaleDateString()}</div>
                                </div>

                                <div className="detail-field">
                                    <div className="detail-label">Updated</div>
                                    <div className="detail-value">{new Date(selectedIssueData.fields.updated).toLocaleDateString()}</div>
                                </div>

                                <div className="detail-field">
                                    <button onClick={() => window.open(`${formData.tenantUrl}/browse/${selectedIssue}`, '_blank')}>
                                        🔗 Open in JIRA
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="app-footer">
                        <span>JIRA Critical Path Analyzer v{APP_VERSION} — {CHANGELOG[0].date}</span>
                        <button className="app-footer-toggle" onClick={() => setShowChangelog(v => !v)}>
                            {showChangelog ? 'Hide changelog' : "What's changed"}
                        </button>
                        <div className="app-footer-links">
                            <a
                                className="app-footer-link"
                                href="https://github.com/adambeltz2/JIRA-Critical-Path-Analyzer"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
                                </svg>
                                GitHub
                            </a>
                            <a
                                className="app-footer-link coffee"
                                href="https://buymeacoffee.com/adambeltz"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                                    <path d="M2 3.5h10.5a2 2 0 0 1 2 2v1.75a2.75 2.75 0 0 1-2.75 2.75H13a4 4 0 0 1-3.86 3H4.86A4 4 0 0 1 1 9.25V4.25A.75.75 0 0 1 1.75 3.5H2Zm.5 1.5v4.25a2.5 2.5 0 0 0 2.5 2.5h4a2.5 2.5 0 0 0 2.5-2.5V5H2.5Zm9.5 1v3.5c.72-.2 1.25-.86 1.25-1.65V6.5a.5.5 0 0 0-.5-.5H12ZM5 1c-.28.34-.28.87 0 1.5S5.28 3.66 5 4M8 1c-.28.34-.28.87 0 1.5s.28 1.16 0 1.5" />
                                </svg>
                                Buy me a coffee
                            </a>
                        </div>
                        {showChangelog && (
                            <div className="app-footer-changelog">
                                {CHANGELOG.map(entry => (
                                    <div key={entry.version} className="app-footer-changelog-entry">
                                        <div className="app-footer-changelog-version">v{entry.version} — {entry.date}</div>
                                        <ul>
                                            {entry.notes.map((note, i) => <li key={i}>{note}</li>)}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<JiraCriticalPathAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
